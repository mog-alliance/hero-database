<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ホワイトアウトサバイバル 英雄データベース</title>
<style>
  :root {
    --bg: #000000;
    --panel: #17222e;
    --panel2: #1e2c3a;
    --border: #2a3b4d;
    --text: #e8eef4;
    --muted: #93a4b5;
    --accent: #4fc3f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .toolbar input, .toolbar select {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 160px; }
  .count { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: var(--accent); }
  .card.selected { border-color: var(--accent); background: #17324a; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .name { font-weight: 600; font-size: 15px; }
  .tier {
    font-weight: 700;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 5px;
    color: #0f1720;
  }
  .meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .class-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 4px;
    color: #0f1720;
    font-weight: 600;
  }
  .notes { font-size: 12px; color: #c3d0dc; line-height: 1.4; }
  .checkbox-indicator {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .card.selected .checkbox-indicator {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1720;
  }
  .compare-tray {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #101b26;
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 -4px 12px rgba(0,0,0,.3);
  }
  .compare-tray.empty { display: none; }
  .tray-label { font-size: 12px; color: var(--muted); }
  .tray-chip {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tray-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 0;
  }
  .btn {
    background: var(--accent);
    color: #0f1720;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 1000px;
    width: 100%;
    max-height: 85vh;
    overflow: auto;
    padding: 20px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel2); color: var(--muted); font-size: 11px; text-transform: uppercase; width: 120px; }
  td.hero-col-name { font-weight: 700; font-size: 14px; }
  .table-scroll { overflow-x: auto; }
  .table-scroll th:first-child, .table-scroll td:first-child {
    position: sticky; left: 0; background: var(--panel2); z-index: 1;
  }
  .compare-cards-view { display: none; }
  .compare-hero-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .compare-hero-card .ch-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .compare-hero-card .ch-head h3 { margin: 0; font-size: 17px; }
  .compare-hero-card .ch-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .compare-hero-card .ch-field { margin-top: 10px; }
  .compare-hero-card .ch-field .ch-label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
    letter-spacing: .03em;
  }
  .compare-hero-card .ch-field .ch-value { font-size: 13px; line-height: 1.5; }
  .compare-hero-card .ch-tiers { display: flex; gap: 8px; flex-wrap: wrap; }
  .compare-hero-card .ch-tiers .tier-chip {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 5px;
    color: #0f1720;
    font-weight: 700;
  }
  @media (max-width: 680px) {
    .table-scroll { display: none; }
    .compare-cards-view { display: block; }
    .modal-overlay { padding: 10px; align-items: flex-start; }
    .modal { padding: 14px; max-height: 92vh; }
    .toolbar { padding: 10px; }
  }
  .skill-line { margin-bottom: 8px; line-height: 1.5; }
  .skill-line:last-child { margin-bottom: 0; }
  .skill-name { display: block; font-weight: 700; color: var(--accent); font-size: 12px; margin-bottom: 1px; }
  .footer-note { margin-top: 24px; font-size: 11px; color: var(--muted); }
  .footer-note a { color: var(--accent); }
  .footer-logo { display: flex; justify-content: center; margin-top: 20px; padding-bottom: 60px; }
  .footer-logo img { max-height: 48px; opacity: 0.85; }
</style>
</head>

<div class="count" id="countLabel"></div>
<div class="grid" id="heroGrid"></div>

<div class="footer-note">

</div>

<div class="footer-logo">
  <img src="mog_logo.png" alt="logo" onerror="this.style.display='none'">
</div>

<div class="compare-tray empty" id="compareTray">

  <button class="btn secondary" id="clearTray">クリア</button>
  <button class="btn" id="openCompare">詳細・比較を見る</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <strong id="compareModalTitle">英雄比較</strong>
      <button class="btn secondary" id="closeModal">閉じる ✕</button>
    </div>
    <div id="compareTableWrap"></div>
  </div>
</div>

<script>
const raw = JSON.parse(document.getElementById('hero-data').textContent);
const heroes = raw.heroes;
const classColors = { '盾兵': '#E74C3C', '弓兵': '#3498DB', '槍兵': '#2ECC71' };
const rarityColors = raw.rarity_colors || { R: '#3498DB', SR: '#9B59B6', SSR: '#F1C40F' };
const tierColors = { 'S+': '#FF3B6E', 'S': '#F1C40F', 'A': '#4FC3F7', 'B': '#7FD37F', 'C': '#B0B8C1', 'D': '#7A8794' };

let selected = new Set();

function populateGenFilter() {
  const gens = [...new Set(heroes.map(h => h.generation))].sort((a,b)=>a-b);
  const sel = document.getElementById('genFilter');
  gens.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g; opt.textContent = '第' + g + '世代';
    sel.appendChild(opt);
  });
}

function tierRank(t) {
  const order = ['S+','S','A','B','C','D'];
  return order.indexOf(t);
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const gen = document.getElementById('genFilter').value;
  const cls = document.getElementById('classFilter').value;
  const rar = document.getElementById('rarityFilter').value;
  const tier = document.getElementById('tierFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let list = heroes.filter(h => {
    if (q && !h.name.toLowerCase().includes(q)) return false;
    if (gen && String(h.generation) !== gen) return false;
    if (cls && h.hero_class !== cls) return false;
    if (rar && h.rarity !== rar) return false;
    if (tier && h.tier_overall !== tier) return false;
    return true;
  });

  if (sortBy === 'tier') list.sort((a,b) => tierRank(a.tier_overall) - tierRank(b.tier_overall) || a.name.localeCompare(b.name));
  else if (sortBy === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortBy === 'gen') list.sort((a,b) => a.generation - b.generation || a.name.localeCompare(b.name));

  return list;
}

function render() {
  const list = getFiltered();
  const grid = document.getElementById('heroGrid');
  grid.innerHTML = '';
  document.getElementById('countLabel').textContent = list.length + ' 体表示中（全 ' + heroes.length + ' 体）';

  list.forEach(h => {
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(h.name) ? ' selected' : '');
    card.innerHTML = `
      <div class="checkbox-indicator">${selected.has(h.name) ? '✓' : ''}</div>
      <div class="card-top">
        <span class="name">${h.name}</span>
        <span class="tier" style="background:${tierColors[h.tier_overall] || '#888'}">${h.tier_overall}</span>
      </div>
      <div class="meta">第${h.generation}世代 ・ ${h.rarity}</div>
      <div style="margin-bottom:6px;">
        <span class="class-tag" style="background:${classColors[h.hero_class] || '#888'}">${h.hero_class}</span>
      </div>
      <div class="notes">${h.notes || ''}</div>
    `;
    card.addEventListener('click', () => toggleSelect(h.name));
    grid.appendChild(card);
  });
}

function toggleSelect(name) {
  if (selected.has(name)) selected.delete(name);
  else {
    if (selected.size >= 4) { alert('比較は最大4体までです'); return; }
    selected.add(name);
  }
  renderTray();
  render();
}

function renderTray() {
  const tray = document.getElementById('compareTray');
  const chips = document.getElementById('trayChips');
  chips.innerHTML = '';
  if (selected.size === 0) { tray.classList.add('empty'); return; }
  tray.classList.remove('empty');
  selected.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'tray-chip';
    chip.innerHTML = `${name} <button data-name="${name}">✕</button>`;
    chip.querySelector('button').addEventListener('click', (e) => {
      e.stopPropagation();
      selected.delete(name);
      renderTray();
      render();
    });
    chips.appendChild(chip);
  });
}

function openCompareModal() {
  if (selected.size < 1) { alert('比較・詳細表示するヒーローを選んでください'); return; }
  const list = heroes.filter(h => selected.has(h.name));
  const skillsHtml = (list, key) => list.map(s => `<div class="skill-line"><span class="skill-name">${s.name}</span>${s.desc}</div>`).join('');

  const rows = [
    ['兵種', h => h.hero_class],
    ['レアリティ', h => h.rarity],
    ['世代', h => '第' + h.generation + '世代'],
    ['総合ティア', h => h.tier_overall],
    ['遠征ティア', h => h.tier_expedition],
    ['探検ティア', h => h.tier_exploration],
    ['入手方法', h => h.how_to_obtain || '-'],
    ['解説', h => h.notes || '-'],
    ['推奨用途', h => h.best_use || '-'],
    ['探検スキル', h => skillsHtml(h.exploration_skills || [])],
    ['遠征スキル', h => skillsHtml(h.expedition_skills || [])],
  ];

  let html = '<div class="table-scroll"><table><thead><tr><th>項目</th>';
  list.forEach(h => html += `<td class="hero-col-name">${h.name}</td>`);
  html += '</tr></thead><tbody>';
  rows.forEach(([label, fn]) => {
    html += `<tr><th>${label}</th>`;
    list.forEach(h => html += `<td>${fn(h)}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // Mobile-friendly stacked card view (one card per hero, no horizontal scrolling needed)
  let cardsHtml = '<div class="compare-cards-view">';
  list.forEach(h => {
    cardsHtml += `
      <div class="compare-hero-card">
        <div class="ch-head">
          <h3>${h.name}</h3>
          <span class="tier" style="background:${tierColors[h.tier_overall] || '#888'}">${h.tier_overall}</span>
        </div>
        <div class="ch-meta">
          <span class="class-tag" style="background:${classColors[h.hero_class] || '#888'}">${h.hero_class}</span>
          ${h.rarity} ・ 第${h.generation}世代
        </div>
        <div class="ch-field">
          <div class="ch-label">遠征ティア / 探検ティア</div>
          <div class="ch-tiers">
            <span class="tier-chip" style="background:${tierColors[h.tier_expedition] || '#888'}">遠征 ${h.tier_expedition}</span>
            <span class="tier-chip" style="background:${tierColors[h.tier_exploration] || '#888'}">探検 ${h.tier_exploration}</span>
          </div>
        </div>
        <div class="ch-field">
          <div class="ch-label">入手方法</div>
          <div class="ch-value">${h.how_to_obtain || '-'}</div>
        </div>
        <div class="ch-field">
          <div class="ch-label">解説</div>
          <div class="ch-value">${h.notes || '-'}</div>
        </div>
        <div class="ch-field">
          <div class="ch-label">推奨用途</div>
          <div class="ch-value">${h.best_use || '-'}</div>
        </div>
        <div class="ch-field">
          <div class="ch-label">探検スキル</div>
          <div class="ch-value">${skillsHtml(h.exploration_skills || [])}</div>
        </div>
        <div class="ch-field">
          <div class="ch-label">遠征スキル</div>
          <div class="ch-value">${skillsHtml(h.expedition_skills || [])}</div>
        </div>
      </div>
    `;
  });
  cardsHtml += '</div>';

  document.getElementById('compareTableWrap').innerHTML = html + cardsHtml;
  document.getElementById('compareModalTitle').textContent = list.length === 1 ? '英雄詳細' : '英雄比較';
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('genFilter').addEventListener('change', render);
document.getElementById('classFilter').addEventListener('change', render);
document.getElementById('rarityFilter').addEventListener('change', render);
document.getElementById('tierFilter').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);
document.getElementById('clearTray').addEventListener('click', () => { selected.clear(); renderTray(); render(); });
document.getElementById('openCompare').addEventListener('click', openCompareModal);
document.getElementById('closeModal').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('open'));
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') e.currentTarget.classList.remove('open'); });

populateGenFilter();
render();
</script>
